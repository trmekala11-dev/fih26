<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Fihh's Proxy</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					"Helvetica Neue",
					Arial,
					sans-serif;
				background: transparent;
				color: #e6f6ff;
				display: grid;
				place-items: center;
				padding: 30px 18px;
			}
			.sheet {
				width: min(1600px, 100%);
				/*border: 1px solid #0d4f7f;
        background: #082f4d;
		*/
				padding: 26px 28px;
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 1.55rem;
				font-weight: 650;
				letter-spacing: 0.005em;
			}
			.meta {
				color: #8ec5e8;
				font-size: 0.78rem;
				margin: 0 0 20px;
			}
			.section {
				margin: 0 0 18px;
			}
			.label {
				display: block;
				margin-bottom: 6px;
				color: #e6f6ff;
				font-size: 1.1rem;
				font-weight: 630;
				letter-spacing: 0.01em;
				text-transform: none;
			}
			p {
				margin: 0;
				color: #bfe3f8;
				line-height: 1.62;
				font-size: 0.94rem;
				max-width: 70ch;
			}
			code {
				font-family: "SF Mono", Menlo, Consolas, monospace;
				color: #e6f6ff;
				background: #0a3b61;
				border: 1px solid #1e5a8a;
				padding: 1px 5px;
			}
			a {
				color: inherit;
				text-decoration: none;
			}
			a:hover {
				text-decoration: underline;
			}
			h1 {
				background: linear-gradient(90deg, #ffffff, #e0f2fe, #fef08a);
				filter: drop-shadow(0 4px 14px rgba(4, 18, 31, 0.75));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				font-size: clamp(2.4rem, 7vw, 5.5rem);
				text-align: center;
				line-height: 1.05;
				font-weight: 700;
				margin: 0;
			}
			.credit {
				margin: -2px 0 14px;
				color: #fde047;
				font-size: 1rem;
				font-weight: 500;
				letter-spacing: 0.04em;
			}
			.label::before {
				content: "";
				display: inline-block;
				width: 8px;
				height: 8px;
				margin-right: 8px;
				border-radius: 50%;
				background: #fde047;
			}
			.search {
				display: flex;
				align-items: center;
				gap: 6px;
				width: min(560px, 100%);
				margin: 56px auto 22px;
				padding: 5px 6px 5px 18px;
				border-radius: 999px;
				background: rgba(125, 211, 252, 0.1);
				border: 1px solid rgba(125, 211, 252, 0.3);
				box-sizing: border-box;
				transition: border-color 0.15s, box-shadow 0.15s;
			}
			.search:focus-within {
				border-color: #38bdf8;
				box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.22);
			}
			.search input {
				flex: 1;
				min-width: 0;
				border: 0;
				outline: none;
				background: transparent;
				color: #e6f6ff;
				font: inherit;
				font-size: 1.05rem;
				padding: 0.5em 0;
			}
			.search input::placeholder {
				color: #6aa7cf;
			}
			.search button {
				border: 0;
				cursor: pointer;
				border-radius: 999px;
				padding: 0.55em 1.3em;
				font: inherit;
				font-weight: 600;
				color: #04121f;
				background: #fde047;
			}
			.search button:hover {
				background: #fef08a;
			}
			.sheet {
				position: relative;
				z-index: 1;
			}
			body, h1, .label {
				font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
			}
			html {
				min-height: 100%;
				background: #031528;
			}
			.blobs {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				pointer-events: none;
				z-index: 0;
			}
			.blobs i {
				position: absolute;
				border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%;
				opacity: 0.9;
				filter: blur(60px);
				animation-timing-function: ease-in-out;
				animation-iteration-count: infinite;
			}
			.b1 { top: 5%; left: 5%; width: 55vmax; height: 55vmax; background: #0a3d7a; animation-duration: 22s, 15s; animation-delay: 0s, 0s; animation-name: bloba, morph; }
			.b2 { top: 40%; left: 55%; width: 50vmax; height: 50vmax; background: #0b4a75; animation-duration: 28s, 19s; animation-delay: -9s, -9s; animation-name: blobb, morph; }
			.b3 { top: 60%; left: 10%; width: 48vmax; height: 48vmax; background: #0d3b6e; animation-duration: 25s, 17s; animation-delay: -4s, -4s; animation-name: blobb, morph; }
			.b4 { top: -5%; left: 60%; width: 44vmax; height: 44vmax; background: #08305a; animation-duration: 31s, 21s; animation-delay: -14s, -14s; animation-name: bloba, morph; }
			.b5 { top: 68%; left: 62%; width: 52vmax; height: 52vmax; background: #0c3f72; animation-duration: 26s, 18s; animation-delay: -7s, -7s; animation-name: bloba, morph; }
			.b6 { top: 30%; left: 25%; width: 40vmax; height: 40vmax; background: #0b3d73; animation-duration: 34s, 23s; animation-delay: -20s, -20s; animation-name: blobb, morph; }
			@keyframes bloba {
				0%, 100% {
					transform: translate(0, 0) scale(1);
				}
				33% {
					transform: translate(18vw, -12vh) scale(1.2);
				}
				66% {
					transform: translate(-10vw, 14vh) scale(0.9);
				}
			}
			@keyframes blobb {
				0%, 100% {
					transform: translate(0, 0) scale(1.1);
				}
				40% {
					transform: translate(-16vw, 10vh) scale(0.85);
				}
				70% {
					transform: translate(12vw, -14vh) scale(1.25);
				}
			}
			@keyframes morph {
				0%, 100% {
					border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%;
				}
				33% {
					border-radius: 40% 60% 35% 65% / 65% 40% 60% 35%;
				}
				66% {
					border-radius: 55% 45% 65% 35% / 40% 55% 45% 60%;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.blobs i {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div class="blobs"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i><i class="b6"></i></div>
		<main class="sheet">
			<div class="title-bg"><h1>Fihh's Proxy</h1></div>
			<p class="credit">Made by Spanish Vanish</p>
			<form class="search" id="search" autocomplete="off">
				<input id="q" type="text" spellcheck="false" autofocus placeholder="Search or enter a URL..." />
				<button type="submit">Go</button>
			</form>
		</main>
		<script>
			document.getElementById("search").addEventListener("submit", function (e) {
				e.preventDefault();
				var v = document.getElementById("q").value.trim();
				if (v) window.parent.postMessage({ type: "fihh-search", value: v }, "*");
			});
		</script>
	</body>
</html>
