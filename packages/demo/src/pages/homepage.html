<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Fihh's Proxy</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<style>
			:root {
				color-scheme: dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					Roboto,
					"Helvetica Neue",
					Arial,
					sans-serif;
				background: radial-gradient(circle at 50% 0%, #0b4a75 0%, #04121f 70%);
				color: #e6f6ff;
				display: grid;
				place-items: center;
				padding: 30px 18px;
			}
			.sheet {
				width: min(1600px, 100%);
				/*border: 1px solid #0d4f7f;
        background: #082f4d;
		*/
				padding: 26px 28px;
				display: flex;
				flex-direction: column;
				align-items: center;
				text-align: center;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 1.55rem;
				font-weight: 650;
				letter-spacing: 0.005em;
			}
			.meta {
				color: #8ec5e8;
				font-size: 0.78rem;
				margin: 0 0 20px;
			}
			.section {
				margin: 0 0 18px;
			}
			.label {
				display: block;
				margin-bottom: 6px;
				color: #e6f6ff;
				font-size: 1.1rem;
				font-weight: 630;
				letter-spacing: 0.01em;
				text-transform: none;
			}
			p {
				margin: 0;
				color: #bfe3f8;
				line-height: 1.62;
				font-size: 0.94rem;
				max-width: 70ch;
			}
			code {
				font-family: "SF Mono", Menlo, Consolas, monospace;
				color: #e6f6ff;
				background: #0a3b61;
				border: 1px solid #1e5a8a;
				padding: 1px 5px;
			}
			a {
				color: inherit;
				text-decoration: none;
			}
			a:hover {
				text-decoration: underline;
			}
			h1 {
				background: linear-gradient(90deg, #ffffff, #e0f2fe, #fef08a);
				filter: drop-shadow(0 4px 14px rgba(4, 18, 31, 0.75));
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				font-size: clamp(2.4rem, 7vw, 5.5rem);
				text-align: center;
				line-height: 1.05;
				font-weight: 700;
				margin: 0;
			}

.waves {
				position: fixed;
				left: 0;
				bottom: 0;
				width: 100%;
				height: 110px;
				overflow: hidden;
				pointer-events: none;
				z-index: 0;
			}
			.wave {
				position: absolute;
				left: 0;
				bottom: 0;
				width: 100%;
				height: 100%;
				background-repeat: repeat-x;
				background-size: 50% 100%;
			}
			.wave.w1 { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 120%22 preserveAspectRatio=%22none%22%3E%3Cpath fill=%22rgba(56,189,248,0.35)%22 d=%22M0,60 C150,100 350,0 600,60 C850,120 1050,20 1200,60 L1200,120 L0,120 Z%22/%3E%3C/svg%3E"); animation: drift 16s linear infinite; }
			.wave.w2 { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 120%22 preserveAspectRatio=%22none%22%3E%3Cpath fill=%22rgba(14,165,233,0.30)%22 d=%22M0,70 C200,10 400,110 600,70 C800,30 1000,110 1200,70 L1200,120 L0,120 Z%22/%3E%3C/svg%3E"); height: 80%; animation: drift 11s linear infinite reverse; }
			.wave.w3 { background-image: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 120%22 preserveAspectRatio=%22none%22%3E%3Cpath fill=%22rgba(37,99,235,0.35)%22 d=%22M0,50 C100,90 300,10 600,50 C900,90 1100,10 1200,50 L1200,120 L0,120 Z%22/%3E%3C/svg%3E"); height: 60%; animation: drift 7s linear infinite; }
			@keyframes drift {
				from {
					background-position-x: 0;
				}
				to {
					background-position-x: 100%;
				}
			}
				from { background-position-x: 0; }
				to { background-position-x: 100%; }
			}
			.credit {
				margin: -2px 0 14px;
				color: #fde047;
				font-size: 1rem;
				font-weight: 500;
				letter-spacing: 0.04em;
			}
			.label::before {
				content: "";
				display: inline-block;
				width: 8px;
				height: 8px;
				margin-right: 8px;
				border-radius: 50%;
				background: #fde047;
			}
			.search {
				display: flex;
				align-items: center;
				gap: 6px;
				width: min(560px, 100%);
				margin: 56px auto 22px;
				padding: 5px 6px 5px 18px;
				border-radius: 999px;
				background: rgba(125, 211, 252, 0.1);
				border: 1px solid rgba(125, 211, 252, 0.3);
				box-sizing: border-box;
				transition: border-color 0.15s, box-shadow 0.15s;
			}
			.search:focus-within {
				border-color: #38bdf8;
				box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.22);
			}
			.search input {
				flex: 1;
				min-width: 0;
				border: 0;
				outline: none;
				background: transparent;
				color: #e6f6ff;
				font: inherit;
				font-size: 1.05rem;
				padding: 0.5em 0;
			}
			.search input::placeholder {
				color: #6aa7cf;
			}
			.search button {
				border: 0;
				cursor: pointer;
				border-radius: 999px;
				padding: 0.55em 1.3em;
				font: inherit;
				font-weight: 600;
				color: #04121f;
				background: #fde047;
			}
			.search button:hover {
				background: #fef08a;
			}
			.sheet {
				position: relative;
				z-index: 1;
			}
			body, h1, .label {
				font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
			}
		</style>
	</head>
	<body>
		<div class="waves"><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div></div>
		<main class="sheet">
			<div class="title-bg"><h1>Fihh's Proxy</h1></div>
			<p class="credit">Made by Spanish Vanish</p>
			<form class="search" id="search" autocomplete="off">
				<input id="q" type="text" spellcheck="false" autofocus placeholder="Search or enter a URL..." />
				<button type="submit">Go</button>
			</form>
		</main>
		<script>
			document.getElementById("search").addEventListener("submit", function (e) {
				e.preventDefault();
				var v = document.getElementById("q").value.trim();
				if (v) window.parent.postMessage({ type: "fihh-search", value: v }, "*");
			});
		</script>
	</body>
</html>
